<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security Meta Tags -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- SEO -->
    <title>DineQR — Smart Restaurant Ordering</title>
    <meta name="description" content="DineQR: QR-based restaurant ordering system. Scan, order, and pay seamlessly from your table." />

    <!-- Fetch Lock (prevents polyfill override) -->
    <script src="/fetch-lock.js"></script>

    <!-- Razorpay Checkout (external dependency) -->
    <script
      src="https://checkout.razorpay.com/v1/checkout.js"
    ></script>
  </head>
  <body>
    <div id="root">
      <!-- Splash screen — shown while React loads, replaced on mount -->
      <style>
        .dineqr-splash {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background: linear-gradient(135deg, #fafaf9 0%, #ecfdf5 50%, #f5f5f4 100%);
          font-family: 'Inter', system-ui, -apple-system, sans-serif;
          gap: 16px;
        }
        .dineqr-splash-icon {
          width: 72px;
          height: 72px;
          background: linear-gradient(135deg, #059669 0%, #047857 100%);
          border-radius: 18px;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 8px 24px -4px rgba(5, 150, 105, 0.3);
          animation: splash-pulse 2s ease-in-out infinite;
        }
        .dineqr-splash-icon svg {
          width: 36px;
          height: 36px;
          color: white;
        }
        .dineqr-splash-title {
          font-size: 24px;
          font-weight: 900;
          color: #1c1917;
          letter-spacing: -0.025em;
          margin: 0;
        }
        .dineqr-splash-sub {
          font-size: 13px;
          color: #a8a29e;
          font-weight: 500;
          margin: 0;
        }
        .dineqr-splash-spinner {
          width: 24px;
          height: 24px;
          border: 3px solid #d1fae5;
          border-top-color: #059669;
          border-radius: 50%;
          animation: splash-spin 0.8s linear infinite;
          margin-top: 8px;
        }
        @keyframes splash-spin {
          to { transform: rotate(360deg); }
        }
        @keyframes splash-pulse {
          0%, 100% { box-shadow: 0 8px 24px -4px rgba(5, 150, 105, 0.3); }
          50% { box-shadow: 0 8px 32px -4px rgba(5, 150, 105, 0.5); }
        }
      </style>
      <div class="dineqr-splash">
        <div class="dineqr-splash-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 2v2"/><path d="M8 2v2"/><path d="m3 20 3-3"/><path d="m21 20-3-3"/>
            <path d="M12 18a6 6 0 0 0 6-6c0-3.31-2.69-8-6-8S6 8.69 6 12a6 6 0 0 0 6 6z"/>
            <path d="m12 18 .5 4"/><path d="m11.5 22 1 0"/>
          </svg>
        </div>
        <p class="dineqr-splash-title">DineQR</p>
        <p class="dineqr-splash-sub">Smart Restaurant Ordering</p>
        <div class="dineqr-splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
