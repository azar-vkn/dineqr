<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security Meta Tags -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- SEO -->
    <title>DineQR — Smart Restaurant Ordering</title>
    <meta name="description" content="DineQR: QR-based restaurant ordering system. Scan, order, and pay seamlessly from your table." />

    <script>
      // Pre-emptively define fetch to prevent dependencies from trying to polyfill/override it
      (function() {
        if (typeof window.fetch === 'function') {
          const originalFetch = window.fetch;
          try {
            const descriptor = Object.getOwnPropertyDescriptor(window, 'fetch');
            if (descriptor && !descriptor.writable && !descriptor.configurable) {
              return;
            }
            Object.defineProperty(window, 'fetch', {
              value: originalFetch,
              configurable: false,
              writable: false
            });
          } catch (e) {
            // Swallow — if we can't lock it, the app still works
          }
        }
      })();
    </script>

    <!-- Razorpay Checkout (external dependency) -->
    <script
      src="https://checkout.razorpay.com/v1/checkout.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
